<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Espaço Elêusis - Psicologia Junguiana & Mindfulness</title>
    <meta name="description" content="Conheça o Espaço Elêusis - Um espaço de autocuidado e renascimento através da Psicologia Junguiana e Mindfulness.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-cream-50: #fdfcfa;
            --color-cream-100: #faf7f2;
            --color-cream-200: #f3ebe0;
            --color-cream-300: #e8dccb;
            --color-beige-400: #d9c7a8;
            --color-beige-500: #c4a97a;
            --color-brown-600: #8b7355;
            --color-brown-700: #6d5a45;
            --color-brown-800: #544635;
            --color-olive-500: #6b7c5a;
            --color-olive-600: #556048;
            --color-olive-700: #454d39;
            --color-gold: #c9a85c;
            --color-gold-hover: #b8964a;
            --color-gold-light: #e8d4a8;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--color-cream-200); }
        .font-display { font-family: 'Cormorant Garamond', serif; }
        .btn-primary { background-color: var(--color-gold); color: white; transition: all 0.3s ease; }
        .btn-primary:hover { background-color: var(--color-gold-hover); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(201, 168, 92, 0.35); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--color-cream-100); }
        ::-webkit-scrollbar-thumb { background: var(--color-beige-500); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-brown-600); }
    </style>
</head>
<body class="text-stone-700 antialiased min-h-screen flex flex-col">
    <nav class="bg-white/95 backdrop-blur-md shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="index.html" class="flex items-center gap-2">
                    <span class="font-display text-xl font-semibold text-brown-800">Espaço Elêusis</span>
                </a>
                <a href="index.html" class="text-sm text-brown-600 hover:text-brown-800 transition flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    Voltar
                </a>
            </div>
        </div>
    </nav>
    <main class="flex-grow">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12 sm:py-16 lg:py-20">
            <!-- Dynamic posts container - rendered by admin-content.js -->
            <div id="espaco-posts-container">
                <!-- Default content shown while JS loads -->
                <div class="text-center py-12">
                    <p class="text-brown-500">Carregando posts...</p>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-brown-800 text-cream-100 py-8">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <span class="font-display text-xl font-semibold text-cream-50">Espaço Elêusis</span>
            <p class="text-brown-400 text-sm mt-2">Psicologia Junguiana & Mindfulness</p>
            <p class="text-brown-500 text-xs mt-4">© 2024 Espaço Elêusis</p>
        </div>
    </footer>
    
    <!-- Admin Content Management Script -->
    <script src="admin-content.js"></script>
    <script>
        // Initialize content management and render posts on espaco.html
        initContentManagement();
    </script>
</body>
</html>
