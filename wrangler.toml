# Cloudflare Pages configuration for Espaço Elêusis
name = "espaco-eleusis"
compatibility_date = "2026-08-16"

# Build configuration (static site)
[build]
command = "echo 'No build needed - static site'"

# Static assets
[build.upload]
dir = "."
format = "service-worker"

# Routes
[[routes]]
pattern = "*"
zone_name = "espaco-eleusis.pages.dev"  # Cambiar después de conectar el dominio

# Custom domain (después de configurar en Cloudflare)
# [[custom_domains]]
# domain = "tudominio.com"
# zone_id = "YOUR_ZONE_ID"